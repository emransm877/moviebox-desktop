name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -r requirements.txt
      - run: .\.venv\Scripts\python.exe -m unittest discover -p "test_*.py"
      - name: Native Settings keyboard and twenty-theme checks
        run: .\.venv\Scripts\python.exe verify_settings_design.py --output verification/settings-ci
      - name: Owned-media control and stalled-source regression
        run: .\.venv\Scripts\python.exe verify_offline_audit.py --output verification/offline-ci
      - name: Native twenty-theme geometry, gesture and history resume checks
        run: .\.venv\Scripts\python.exe verify_spatial_home.py --output verification/spatial-ci --generated-fixtures --media verification/offline-ci/owned-fixture.avi
      - run: .\.venv\Scripts\python.exe tools/check_release.py
      - run: .\.venv\Scripts\python.exe tools/check_docs.py
      - run: .\.venv\Scripts\python.exe -m compileall -q main.py fluent_ui.py interactions.py subtitle_store.py audio_options.py settings_ui.py spatial_hero.py home_panels.py themes.py json_transport.py
      - name: Build native application
        shell: powershell
        run: ./build.ps1
      - name: Build installable setup EXE
        shell: powershell
        run: |
          $toolInstaller = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'MovieBoxInnoSetup'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $toolInstaller
          if ((Get-FileHash -LiteralPath $toolInstaller).Hash -ne '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0') { throw 'Compiler download hash mismatch' }
          if ((Get-AuthenticodeSignature -LiteralPath $toolInstaller).Status -ne 'Valid') { throw 'Compiler signature verification failed' }
          $toolProcess = Start-Process -FilePath $toolInstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$toolDirectory") -WindowStyle Hidden -Wait -PassThru
          if ($toolProcess.ExitCode -ne 0) { throw 'Compiler installation failed' }
          ./build-installer.ps1 -Compiler (Join-Path $toolDirectory 'ISCC.exe')
      - uses: actions/upload-artifact@v4
        with:
          name: MovieBox-Desktop-Windows-x64
          path: dist/MovieBox/
      - uses: actions/upload-artifact@v4
        with:
          name: MovieBox-Setup-Windows-x64
          path: dist/installer/*.exe
